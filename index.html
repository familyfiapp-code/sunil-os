<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunil OS">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<title>Sunil OS</title>
<style>
:root{
  --bg:#070b17; --bg2:#0b1222; --card:#0f1729; --card2:#16213a; --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --text:#f1f5f9; --muted:#93a3bd; --dim:#64748b;
  --amber:#f59e0b; --amber2:#fbbf24; --orange:#f97316; --good:#34d399; --bad:#fb7185; --blue:#60a5fa; --violet:#a78bfa; --teal:#2dd4bf; --pink:#f472b6;
  --grad:linear-gradient(135deg,#fbbf24,#f97316);
  --r:18px; --pad:clamp(14px,3vw,28px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 0% -10%,rgba(245,158,11,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(167,139,250,.10),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--text);font:15px/1.5 Inter,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{min-height:84px;resize:vertical}
a{color:var(--amber2);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)} .dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .amber{color:var(--amber2)}
.small{font-size:12.5px} .tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(7,11,23,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hbar{max-width:1180px;margin:auto;padding:12px var(--pad);display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;flex:none}
.hello{min-width:0}.hello b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello span{white-space:nowrap}
@media(max-width:480px){.hello b{font-size:15px}.save span{display:none}.chip.exam{padding:5px 9px;font-size:11.5px}.hbar{gap:9px}.logo{width:34px;height:34px}}
.hello span{font-size:12px;color:var(--muted)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.exam{border-color:rgba(249,115,22,.55);background:rgba(249,115,22,.12);color:#fdba74}
.chip.exam b{font-size:15px;color:#fff}
.save{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.save.busy i{background:var(--amber);animation:blink 1s infinite}
.save.err i{background:var(--bad)}
@keyframes blink{50%{opacity:.25}}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;font-size:17px;flex:none}

/* layout */
main{max-width:1180px;margin:auto;padding:16px var(--pad) 24px}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:960px){.cols{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
.cols>*,.grid2>*{min-width:0}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h2 .t{display:flex;align-items:center;gap:8px}
.sec{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 2px 10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--grad);color:#1a1205;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line2);font-weight:600}
.btn.sm{padding:7px 11px;border-radius:10px;font-size:13px}
.btn.good{background:var(--good);color:#052e1c}
.btn:active{transform:scale(.97)}
.link{background:none;border:0;color:var(--amber2);font-weight:600;padding:0;font-size:13px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.good{background:rgba(52,211,153,.14);color:var(--good)} .pill.bad{background:rgba(251,113,133,.14);color:var(--bad)}
.pill.amber{background:rgba(245,158,11,.15);color:var(--amber2)} .pill.blue{background:rgba(96,165,250,.14);color:var(--blue)}
.bar{height:8px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;font-size:14px}

/* NOW card */
.now{position:relative;overflow:hidden;border:1px solid rgba(245,158,11,.38);background:radial-gradient(500px 220px at 100% 0%,rgba(249,115,22,.18),transparent 70%),linear-gradient(180deg,rgba(245,158,11,.06),transparent),var(--card)}
.now .lbl{font-size:11px;letter-spacing:1.6px;font-weight:800;color:var(--amber2);display:flex;align-items:center;gap:8px}
.now .lbl .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(251,113,133,.7);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(251,113,133,0)}100%{box-shadow:0 0 0 0 rgba(251,113,133,0)}}
.now h3{margin:8px 0 6px;font-size:clamp(19px,2.4vw,24px);line-height:1.3;font-weight:800;letter-spacing:-.4px}
.now .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.now .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.now .acts .btn{flex:1 1 0;min-width:0;padding:11px 8px}

/* day stats tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;position:relative}
.tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px}
.tile small{color:var(--muted);font-size:11.5px}
.tile .mini{height:5px;margin-top:8px}
button.tile{width:100%}

/* timeline */
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:var(--card2)}
.tl{position:relative;margin-top:4px}
.tli{display:grid;grid-template-columns:64px 26px 1fr;gap:8px;align-items:start;padding:9px 0;position:relative}
.tli:not(:last-child)::after{content:"";position:absolute;left:84px;top:34px;bottom:-9px;width:2px;background:var(--line)}
.tli .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px;line-height:1.25}
.tli .tm b{display:block;color:var(--text);font-size:13px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:var(--bg2);display:grid;place-items:center;font-size:13px;font-weight:900;color:#052e1c;padding:0;position:relative;z-index:1}
.tli.done .ck{background:var(--good);border-color:var(--good)}
.tli.now .ck{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.18)}
.tli.missed .ck{border-color:var(--bad)}
.tli.skip .ck{background:var(--card2);color:var(--muted)}
.tli .bd{min-width:0}
.tli .bt{font-size:14.5px;line-height:1.4;word-wrap:break-word;cursor:pointer}
.tli.done .bt,.tli.skip .bt{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(148,163,184,.5)}
.tli .tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.k{font-size:10px;font-weight:800;letter-spacing:.8px;padding:2px 7px;border-radius:6px}
.k-exam{background:rgba(251,113,133,.16);color:#fda4af} .k-mock{background:rgba(167,139,250,.16);color:#c4b5fd}
.k-practice{background:rgba(96,165,250,.15);color:#93c5fd} .k-read{background:rgba(45,212,191,.14);color:#5eead4}
.k-review{background:rgba(244,114,182,.14);color:#f9a8d4} .k-life{background:rgba(148,163,184,.14);color:#cbd5e1}
.k-deadline{background:rgba(245,158,11,.18);color:var(--amber2)}
.tli.now{background:linear-gradient(90deg,rgba(245,158,11,.08),transparent);border-radius:12px}
.xbtn{background:none;border:0;color:var(--dim);font-size:13px;padding:2px 4px}

/* habits */
.habits{display:flex;flex-wrap:wrap;gap:8px}
.hb{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);font-size:13px;font-weight:600}
.hb.on{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5);color:#a7f3d0}
.hb .i{font-size:15px}

/* tasks */
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .ck{width:22px;height:22px;flex:none;margin-top:1px}
.task.done .ck{background:var(--good);border-color:var(--good)}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.tt{font-size:14px;line-height:1.4}
.qadd{display:flex;gap:8px;margin-top:10px}
.qadd input{padding:9px 12px}

/* chips filter */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1px solid var(--line2);background:var(--card2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--amber);border-color:var(--amber);color:#1a1205}

/* plan tab */
.road{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.step{flex:1 1 0;min-width:0;text-align:center;position:relative;padding:4px 2px;background:none;border:0}
.step small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:480px){.step .c{width:38px;height:38px;font-size:11.5px}.step:not(:last-child)::after{top:23px;left:calc(50% + 21px);right:calc(-50% + 21px)}}
.step .c{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--line2);background:var(--card2);position:relative;z-index:1}
.step.cur .c{border-color:var(--amber);background:rgba(245,158,11,.15);color:var(--amber2);box-shadow:0 0 0 6px rgba(245,158,11,.10)}
.step.ok .c{border-color:var(--good);background:var(--good);color:#052e1c}
.step:not(:last-child)::after{content:"";position:absolute;top:26px;left:calc(50% + 24px);right:calc(-50% + 24px);height:2px;background:var(--line2)}
.step.ok:not(:last-child)::after{background:var(--good)}
.step b{display:block;font-size:13px} .step small{color:var(--muted);font-size:11px}
.phase{display:grid;grid-template-columns:2fr 1fr 1fr;gap:4px;margin:14px 0 8px;position:relative}
.phase div{height:10px;border-radius:6px;background:var(--card2)}
.phase div.on{background:var(--grad)}
.phase div.past{background:rgba(52,211,153,.5)}
.phlbl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:4px;font-size:11px;color:var(--muted)}
.phlbl span.on{color:var(--amber2);font-weight:700}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:10.5px;min-width:0;overflow:hidden;white-space:nowrap}
.wd b{display:block;font-size:15px;margin:2px 0}
.wd.today{border-color:var(--amber)}
.wd .ic{font-size:13px;min-height:18px}
.ms{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .e{font-size:22px;text-align:center}
.goal{padding:12px 0;border-bottom:1px solid var(--line)} .goal:last-child{border-bottom:0}
.goal input[type=range]{padding:0;background:none;border:0;accent-color:var(--amber)}

/* progress tab */
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.score{grid-template-columns:repeat(2,1fr)}}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,30px));gap:5px;justify-content:center}
.heat div{aspect-ratio:1;border-radius:6px;background:var(--card2);position:relative}
.heat div[data-l="1"]{background:rgba(245,158,11,.25)} .heat div[data-l="2"]{background:rgba(245,158,11,.5)}
.heat div[data-l="3"]{background:rgba(245,158,11,.8)} .heat div[data-l="4"]{background:var(--good)}
.heat div.t{outline:2px solid var(--text);outline-offset:1px}
.heat span{font-size:10px;color:var(--dim);text-align:center}
.rq{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rq:last-child{border-bottom:0}
.rq .n{width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left} th{color:var(--muted);font-weight:600;font-size:12px}
details summary{cursor:pointer;color:var(--amber2);font-weight:600;font-size:13px;margin-top:10px}
.hgrid{display:grid;grid-template-columns:1fr repeat(7,22px);gap:5px;align-items:center;font-size:13px}
.hgrid i{width:22px;height:22px;border-radius:6px;background:var(--card2);display:block}
.hgrid i.on{background:var(--good)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--muted)}
.bars div i{width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--blue);min-height:3px}
.bars div i.over{background:var(--bad)}

/* error log */
.ebar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.ebar .bar{height:10px}
.ebar .bar>i{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line2);background:var(--card2);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chips button.on{background:rgba(251,113,133,.16);border-color:var(--bad);color:#fecdd3}
.trap{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px} .trap:last-child{border-bottom:0}
.tl5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.tl5 span{font-size:10.5px;text-align:center;border-radius:6px;padding:3px 0;background:var(--card2);color:var(--muted)}
.tl5 span.lo{background:rgba(251,113,133,.16);color:#fda4af} .tl5 span.hi{background:rgba(52,211,153,.14);color:var(--good)}
/* journal */
.moods{display:flex;gap:6px}
.moods button{flex:1;font-size:24px;padding:8px 0;border-radius:12px;border:1px solid var(--line2);background:var(--card2)}
.moods button.on{border-color:var(--amber);background:rgba(245,158,11,.15)}
.entry{padding:10px 0;border-bottom:1px solid var(--line)} .entry:last-child{border-bottom:0}
.lane{background:var(--card2);border-radius:14px;padding:10px}
.lane h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.idea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13.5px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,14,28,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nwrap{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nb{background:none;border:0;color:var(--dim);padding:10px 0 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--amber2)}
.fab{width:56px;height:56px;margin:-22px auto 0;border-radius:18px;border:0;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 30px rgba(249,115,22,.4);color:#1a1205}
.fab svg{width:26px;height:26px}

/* sheet (modal) */
.ov{position:fixed;inset:0;background:rgba(2,6,16,.66);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
.sheet .foot{display:flex;gap:8px;margin-top:16px}
.sheet .foot .btn{flex:1}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:-6px auto 12px}

/* focus overlay */
.focus{position:fixed;inset:0;z-index:60;background:radial-gradient(600px 400px at 50% 30%,rgba(249,115,22,.16),transparent 70%),#050811;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.focus.show{display:flex}
.fring{width:min(78vw,320px);aspect-ratio:1;position:relative;margin:18px 0}
.fring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fring .tx{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.fring .tx b{font-size:clamp(46px,13vw,68px);font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.focus .what{max-width:520px;font-size:17px;font-weight:600;line-height:1.4}
.focus .rule{color:var(--muted);font-size:13px;margin-top:6px}

#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-90px);z-index:80;background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
.cf{position:fixed;width:8px;height:12px;z-index:90;pointer-events:none;border-radius:2px;animation:cf 1.1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
#boot .l{width:64px;height:64px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.9);opacity:.7}}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
#boot .lock{max-width:360px;width:calc(100% - 40px);text-align:center;padding:24px}
#boot .lock .l{width:64px;height:64px;margin:0 auto 8px;display:block}
#boot .lock input{width:100%;box-sizing:border-box;margin:6px 0;padding:12px 14px;border-radius:12px;border:1px solid rgba(148,163,184,.3);background:rgba(15,23,42,.7);color:inherit;font:inherit;font-size:16px}
</style>
</head>
<body>

<div id="boot"><div style="text-align:center"><svg class="l" viewBox="0 0 512 512" id="bootlogo"></svg><div class="muted small" style="margin-top:10px">Opening Sunil OS…</div></div></div>

<header>
  <div class="hbar">
    <svg class="logo" viewBox="0 0 512 512" id="hlogo"></svg>
    <div class="hello"><b id="hi">Sunil OS</b><span id="hdate"></span></div>
    <div class="hright">
      <span class="chip exam hidden" id="examchip"></span>
      <span class="save" id="save"><i></i><span>Saved</span></span>
      <button class="iconbtn" data-act="openSettings" title="Settings &amp; data">⚙️</button>
    </div>
  </div>
</header>

<main id="main"></main>

<nav><div class="nwrap" id="nav"></div></nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<div class="focus" id="focus">
  <div class="tiny muted" style="letter-spacing:2px;font-weight:800">DEEP FOCUS</div>
  <div class="what" id="fwhat"></div>
  <div class="fring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(148,163,184,.15)" stroke-width="7"/>
    <circle id="farc" cx="60" cy="60" r="54" fill="none" stroke="url(#fg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/>
    <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs></svg>
    <div class="tx"><b id="ftime">50:00</b><span class="muted small" id="fsub">ready</span></div></div>
  <div class="seg" id="fpre" style="justify-content:center"></div>
  <div class="row" style="justify-content:center;margin-top:6px">
    <button class="btn" id="fgo" data-act="fToggle" style="min-width:140px">▶ Start</button>
    <button class="btn ghost" data-act="fFinish">✓ Finish</button>
    <button class="btn ghost" data-act="fClose">Close</button>
  </div>
  <div class="rule">Phone in another room. One task only. If the urge to scroll hits, breathe 5 times and continue.</div>
</div>

<div id="toast"></div>

<script>
/* ═════════ Sunil OS v3 ═════════
   Today = what I do now + my day · Plan = where I'm going · Progress = how I'm doing · Journal = how I feel & think
   Rule: every piece of information lives in exactly one tab. */

const LOGO = '<defs><linearGradient id="LB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16223b"/><stop offset="1" stop-color="#0b1120"/></linearGradient><linearGradient id="LG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#LB)"/><circle cx="256" cy="256" r="188" fill="none" stroke="#23314f" stroke-width="20"/><circle cx="256" cy="256" r="188" fill="none" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" stroke-dasharray="886 1181" transform="rotate(-90 256 256)"/><circle cx="68" cy="256" r="17" fill="#fde68a"/><path d="M297 157 A58 58 0 1 0 256 256 A58 58 0 1 1 215 355" fill="none" stroke="url(#LG)" stroke-width="46" stroke-linecap="round"/>';
document.getElementById('hlogo').innerHTML = LOGO;
document.getElementById('bootlogo').innerHTML = LOGO.replace(/\bLB\b/g, 'BB').replace(/\bLG\b/g, 'BG');

/* ───────── state & helpers ───────── */
let D = null, TAB = 'today', DATE = null, TASKF = 'upcoming', SAVING = 0, LOADED_AT = 0;
try { TAB = localStorage.getItem('sos_tab') || 'today'; } catch (e) {}
const SHEETS = ['Settings','Goals','GoalLog','Tasks','Courses','CPA','StudyLog','Thoughts','Ideas','Distraction','Plan','Chapters','Readiness','Mocks','Habits','HabitLog','DayLog','Milestones','Errors'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v) || 0;
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const fmtD = (s, o) => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', o || {weekday: 'short', day: 'numeric', month: 'short'});
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const hm = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const dur = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '') : m + 'm';
const uid = () => Math.random().toString(16).slice(2, 10);
const S = () => { const o = {}; (D.Settings || []).forEach(r => o[r.Key] = r.Value); return o; };
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const ymd = s => s.replace(/-/g, '');

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2300); }
function confetti(x, y, n, big){
  const C = ['#fbbf24','#f97316','#f472b6','#a78bfa','#34d399','#60a5fa'];
  for (let i = 0; i < n; i++) { const p = document.createElement('i'); p.className = 'cf';
    const a = Math.random() * 6.283, v = (big ? 260 : 110) * (.4 + Math.random());
    p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = C[i % C.length];
    p.style.setProperty('--dx', (Math.cos(a) * v).toFixed(0) + 'px'); p.style.setProperty('--dy', (Math.sin(a) * v - (big ? 160 : 60)).toFixed(0) + 'px');
    p.style.setProperty('--r', (Math.random() * 900 - 450).toFixed(0) + 'deg'); document.body.appendChild(p); setTimeout(() => p.remove(), 1200); }
}

/* ───────── server bridge (v4): private API + instant cache + offline-safe save queue ───────── */
const API = 'https://script.google.com/macros/s/AKfycbzVJrzO2Hx_eNfyhUT7XJrRcgIQqAKv8kc1TkkuQZG3FO0AW0cxzD4ZjNdDMNhMYJ0p/exec';
const LS = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }, del(k){ try { localStorage.removeItem(k); } catch (e) {} } };
let KEY = LS.get('sos_key') || '';
function call(fn, args, key){
  if (window.__MOCK_RUN) return Promise.resolve().then(() => window.__MOCK_RUN(fn, ...(args || [])));
  return fetch(API, {method: 'POST', body: JSON.stringify({key: key == null ? KEY : key, fn, args: args || []}), redirect: 'follow'})
    .then(r => r.json(), () => { const e = new Error('No internet connection'); e.net = true; throw e; })
    .then(j => { if (!j.ok) { const e = new Error(j.error); e.server = true; if (j.error === 'AUTH' && key == null && KEY) lockOut(); throw e; } return j.data; });
}
function run(fn, ...args){ return call(fn, args); }

let OPS = []; try { OPS = JSON.parse(LS.get('sos_q') || '[]'); } catch (e) {}
let FLUSHING = false, RETRY = 0;
const saveOps = () => LS.set('sos_q', JSON.stringify(OPS));
let CT = null;
function cacheSoon(){ clearTimeout(CT); CT = setTimeout(() => { if (D) LS.set('sos_cache', JSON.stringify(D)); }, 400); }
function setSave(state){ const el = document.getElementById('save'); el.className = 'save ' + (state || ''); el.lastChild.textContent = state === 'busy' ? 'Saving…' : state === 'err' ? (navigator.onLine === false ? 'Offline · will sync' : 'Retrying…') : 'Saved'; }
function queue(fn, ...args){ OPS.push({fn, args}); saveOps(); cacheSoon(); setSave('busy'); flush(); return Promise.resolve(); }
function flush(){
  if (FLUSHING || !OPS.length || !KEY) { if (!OPS.length) setSave(''); return; }
  FLUSHING = true; setSave('busy');
  const op = OPS[0];
  call(op.fn, op.args).then(() => { OPS.shift(); saveOps(); RETRY = 0; FLUSHING = false; if (OPS.length) flush(); else { setSave(''); if (PENDING_LOAD) load(); } },
    e => { FLUSHING = false;
      if (e && e.server && e.message !== 'AUTH') { OPS.shift(); saveOps(); toast('⚠️ Could not save: ' + e.message); flush(); return; }
      if (e && e.message === 'AUTH') return;
      setSave('err'); RETRY = Math.min(RETRY + 1, 6); setTimeout(flush, 1000 * Math.pow(2, RETRY)); });
}
addEventListener('online', () => { RETRY = 0; flush(); });
const busy = () => OPS.length > 0 || SAVING > 0;
function put(sheet, obj, silent){
  const arr = D[sheet] = D[sheet] || [];
  const o = {}; Object.keys(obj).forEach(k => o[k] = obj[k] == null ? '' : String(obj[k]));
  let row = o.ID && arr.find(r => r.ID === o.ID);
  if (row) Object.assign(row, o); else { o.ID = o.ID || uid(); arr.push(o); }
  queue('upsert', sheet, o);
  if (sheet === 'Plan') calSoon();
  if (!silent) render();
  return o;
}
let CALT = null;
function calSoon(){ if (S().CalendarSync !== 'on') return; clearTimeout(CALT); CALT = setTimeout(() => { if (OPS.length) return calSoon(); run('syncCalendar').catch(() => {}); }, 15000); }
function drop(sheet, id){ D[sheet] = (D[sheet] || []).filter(r => r.ID !== id); queue('remove', sheet, id); if (sheet === 'Plan') calSoon(); render(); }
function setting(k, v){ const r = D.Settings.find(x => x.Key === k); if (r) r.Value = String(v); else D.Settings.push({Key: k, Value: String(v)}); queue('setSetting', k, v); }

function show(d){ SHEETS.forEach(n => d[n] = d[n] || []); D = d; DATE = DATE || today(); document.getElementById('boot').style.display = 'none'; render(); }
let PENDING_LOAD = false;
function load(){
  if (busy()) { PENDING_LOAD = true; return Promise.resolve(); }   // never overwrite unsaved changes
  PENDING_LOAD = false;
  return run('getAll').then(d => {
    if (!d || busy()) { if (d) PENDING_LOAD = true; return; }
    LOADED_AT = Date.now(); LS.set('sos_cache', JSON.stringify(d));
    if (!document.querySelector('.ov.show')) show(d); else D = Object.assign(D || {}, d);
  }).catch(e => { if (e && e.message === 'AUTH') return;
    if (D) { setSave('err'); return; }
    bootMsg('Could not load: ' + esc(e.message || e), '<button class="btn" onclick="location.reload()">Retry</button>'); });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && !busy() && Date.now() - LOADED_AT > 60000) load(); });

/* ───────── passcode lock ───────── */
function bootMsg(html, extra){ const b = document.getElementById('boot'); b.style.display = ''; b.innerHTML = '<div class="card lock"><svg class="l" viewBox="0 0 512 512">' + LOGO.replace(/\bLB\b/g, 'KB').replace(/\bLG\b/g, 'KG') + '</svg>' + html + (extra || '') + '</div>'; }
function lockOut(){ KEY = ''; LS.del('sos_key'); D = null; lockScreen(); }
function lockScreen(msg){
  bootMsg('<div class="muted small">Checking…</div>');
  call('status', [], '').then(st => {
    const create = !st.ready;
    if (create && !st.setupOpen) { bootMsg('<h3>Set up needed</h3><p class="small muted">Passcode setup is closed. In Apps Script, run <b>openPasscodeSetup</b>, then reload this page within 30 minutes.</p>', '<button class="btn" onclick="location.reload()">Reload</button>'); return; }
    bootMsg('<h3>' + (create ? 'Create your passcode' : 'Welcome back, Sunil') + '</h3><p class="small muted">' + (create ? 'At least 8 characters. You will type it once per device. Keep it private.' : 'Enter your passcode to unlock this device.') + '</p>' +
      '<form id="lockf"><input id="pc1" type="password" autocomplete="' + (create ? 'new-password' : 'current-password') + '" placeholder="Passcode" required minlength="' + (create ? 8 : 1) + '">' +
      (create ? '<input id="pc2" type="password" autocomplete="new-password" placeholder="Repeat passcode" required>' : '') +
      '<div id="lerr" class="small" style="color:#f87171;min-height:18px">' + esc(msg || '') + '</div><button class="btn" style="width:100%">' + (create ? 'Create & open' : 'Unlock') + '</button></form>');
    document.getElementById('pc1').focus();
    document.getElementById('lockf').onsubmit = e => { e.preventDefault();
      const a = document.getElementById('pc1').value, er = document.getElementById('lerr'), btn = e.target.querySelector('button');
      if (create && a !== document.getElementById('pc2').value) { er.textContent = 'The two passcodes do not match.'; return; }
      btn.disabled = true; btn.textContent = 'Checking…';
      call(create ? 'claim' : 'ping', [], a).then(() => { KEY = a; LS.set('sos_key', a); bootMsg('<div class="muted small">Loading your day…</div>'); flush(); load(); })
        .catch(err => { btn.disabled = false; btn.textContent = create ? 'Create & open' : 'Unlock'; er.textContent = err.message === 'AUTH' ? 'Wrong passcode.' : err.message; });
    };
  }).catch(e => bootMsg('<p>Could not reach your data: ' + esc(e.message || e) + '</p>', '<button class="btn" onclick="location.reload()">Retry</button>'));
}
function lockDevice(){ if (OPS.length && !confirm('Some changes are still saving. Lock anyway?')) return; ['sos_key', 'sos_cache', 'sos_q'].forEach(LS.del); location.reload(); }

function start(){
  if (!KEY && !window.__MOCK_RUN) return lockScreen();
  let c = null; try { c = JSON.parse(LS.get('sos_cache') || 'null'); } catch (e) {}
  if (c && c.Settings) show(c);              // instant: last-known data, then refresh
  if (OPS.length) { setSave('busy'); flush(); PENDING_LOAD = true; } else load();
}
setInterval(() => { if (D && !document.hidden) { if (DATE !== today() && DATE === addDays(today(), -1)) DATE = today(); if (TAB === 'today' && !document.querySelector('.ov.show')) render(); } }, 60000);

/* ───────── plan block intelligence ───────── */
function parseT(t){
  const m = String(t).match(/(\d{1,2}):(\d{2})(?:\s*[-–]\s*(\d{1,2}):(\d{2}))?/);
  if (!m) return {s: 0, e: null};
  return {s: m[1] * 60 + +m[2], e: m[3] != null ? m[3] * 60 + +m[4] : null};
}
function kind(b){
  const s = String(b).toLowerCase();
  if (/deadline/.test(s)) return ['deadline', 'DEADLINE'];
  if (/far exam|aud exam|reg exam|tcp exam|prometric/.test(s)) return ['exam', 'EXAM'];
  if (/mock|exam slot|sim set/.test(s)) return ['mock', 'MOCK'];
  if (/review|error log|classify/.test(s)) return ['review', 'REVIEW'];
  if (/sleep|lunch|wake|leave home|pack|breakfast|family|rest|walk|errand|taper|sanskar/.test(s)) return ['life', 'LIFE'];
  if (/read|cheat|flashcard|recall|blurt|revision|traps|write it out/.test(s)) return ['read', 'RECALL'];
  if (/mcq|sim|library|practice|chapter|cpa|study/.test(s)) return ['practice', 'PRACTICE'];
  return ['life', 'BLOCK'];
}
const isStudy = b => { const k = kind(b)[0]; return k !== 'life'; };
function blocks(date){
  const arr = D.Plan.filter(p => p.Date === date).map(p => ({...p, ...parseT(p.Time)})).sort((a, b) => a.s - b.s);
  arr.forEach((b, i) => { b.end = b.e != null ? b.e : (arr[i + 1] && arr[i + 1].s > b.s ? Math.min(arr[i + 1].s, b.s + 60) : b.s + 30); b.min = b.e != null ? b.e - b.s : 0; });
  return arr;
}
function bstatus(b, date){
  if (b.Done === 'Yes') return 'done';
  if (b.Done === 'Skip') return 'skip';
  const t = today();
  if (date < t) return 'missed';
  if (date > t) return 'up';
  const n = nowMin();
  if (n >= b.s && n < b.end) return 'now';
  return n >= b.end ? 'missed' : 'up';
}
function studyMin(date){
  return blocks(date).filter(b => b.Done === 'Yes' && isStudy(b.Block)).reduce((a, b) => a + b.min, 0) +
    D.StudyLog.filter(r => r.Date === date).reduce((a, r) => a + num(r.Minutes), 0);
}
function adherence(date){ const bs = blocks(date); if (!bs.length) return null; return bs.filter(b => b.Done === 'Yes').length / bs.length; }
function goodDay(d){ const a = adherence(d); return (a != null && a >= .5) || studyMin(d) >= 60; }
function streak(){ const t = today(); let s = 0; for (let i = goodDay(t) ? 0 : 1; i < 400; i++) { if (goodDay(addDays(t, -i))) s++; else break; } return s; }
function xp(){
  const v = D.Plan.filter(p => p.Done === 'Yes').length * 10 + D.StudyLog.reduce((a, r) => a + num(r.Minutes), 0) +
    D.Plan.filter(p => p.Done === 'Yes' && isStudy(p.Block)).reduce((a, p) => { const t = parseT(p.Time); return a + (t.e != null ? t.e - t.s : 0); }, 0) +
    D.HabitLog.length * 5 + D.DayLog.length * 15;
  const lv = Math.floor(Math.sqrt(v / 60)) + 1, cur = 60 * (lv - 1) ** 2, nxt = 60 * lv * lv;
  return {v, lv, toNext: nxt - v, pct: Math.round((v - cur) / (nxt - cur) * 100)};
}
const LEVELS = ['Rookie','Learner','Grinder','Analyst','Senior Analyst','Controller','Finance Manager','Director','VP Finance','CFO','CFO · USA'];
const lvName = lv => LEVELS[Math.min(lv - 1, LEVELS.length - 1)];

/* ───────── exam + readiness ───────── */
function nextExam(){ return [...D.CPA].sort((a, b) => num(a.Order) - num(b.Order)).find(c => c.Status !== 'Passed'); }
function phaseOf(dl){ return dl == null ? 0 : dl > 28 ? 1 : dl > 14 ? 2 : dl >= 0 ? 3 : 0; }
const PHASES = ['', 'Fix weak chapters', 'Mixed review', 'Exam simulation'];
const PHASE_TIP = ['', 'Redo flagged MCQs and SIMs in your weakest chapters. Accuracy over volume.',
  'Mix all chapters. 1 mini mock every 3rd day. Rewrite every mistake as a one-line rule.',
  'Full mocks at exam time (12:30). Review every wrong answer. No new topics in the last 3 days.'];
function readiness(sec){
  sec = sec || 'FAR';
  const s = S(), tM = num(s.TargetMCQAcc) || 75, tS = num(s.TargetSIMAcc) || 70;
  const ch = D.Chapters.filter(c => c.Section === sec).sort((a, b) => a.Code.localeCompare(b.Code, undefined, {numeric: true}));
  if (!ch.length) return null;
  const sum = (arr, f) => arr.reduce((a, c) => a + num(c[f]), 0);
  const core = ch.filter(c => !/review/i.test(c.Name));
  const cm = sum(core, 'MCQTotal') || 1, cs = sum(core, 'SIMTotal') || 1;
  const mAtt = sum(ch, 'MCQAttempted'), mAcc = mAtt ? sum(ch, 'MCQCorrect') / mAtt * 100 : 0;
  const sAtt = sum(ch, 'SIMAttempted'), sAcc = sAtt ? ch.reduce((a, c) => a + num(c.SIMAcc) * num(c.SIMAttempted), 0) / sAtt : 0;
  const coreAtt = sum(core, 'MCQAttempted'), coreAcc = coreAtt ? sum(core, 'MCQCorrect') / coreAtt * 100 : 0;
  const rows = ch.map(c => {
    const ma = num(c.MCQAttempted) ? num(c.MCQCorrect) / num(c.MCQAttempted) * 100 : null, sa = num(c.SIMAttempted) ? num(c.SIMAcc) : null;
    const review = /review/i.test(c.Name);
    const gain = review ? 0 : .5 * Math.max(0, tM - (ma ?? tM)) * num(c.MCQTotal) / cm + .5 * Math.max(0, tS - (sa ?? tS)) * num(c.SIMTotal) / cs;
    return {...c, ma, sa, review, gain};
  });
  const mocks = D.Mocks.filter(m => m.Section === sec).sort((a, b) => b.Date.localeCompare(a.Date));
  const good = mocks.filter(m => m.Type === 'Mocktest' || m.Type === 'Practice Exam').slice(0, 2).filter(m => num(m.Score) >= tM).length;
  return {sec, tM, tS, rows, queue: rows.filter(r => !r.review && r.gain > .3).sort((a, b) => b.gain - a.gain),
    mAcc, sAcc, coreAcc, score: (mAcc + sAcc) / 2, target: (tM + tS) / 2, flagged: sum(ch, 'MCQFlagged'), mocks, good,
    hist: D.Readiness.filter(r => r.Section === sec).sort((a, b) => a.Date.localeCompare(b.Date)), review: rows.find(r => r.review),
    ready: mAcc >= tM && sAcc >= tS && good >= 2};
}

/* ───────── render ───────── */
const ICONS = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l5-14 6 9 5-6"/><circle cx="20" cy="8" r="1.5"/></svg>',
  progress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M9 9h6M9 13h4"/></svg>',
  focus: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg>'
};
function render(){
  if (!D) return;
  const s = S(), h = new Date().getHours();
  document.getElementById('hi').textContent = (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ', ' + (s.Name || 'Sunil');
  document.getElementById('hdate').textContent = new Date().toLocaleDateString('en-IN', {weekday: 'long', day: 'numeric', month: 'long'});
  const nx = nextExam(), ec = document.getElementById('examchip');
  if (nx && nx.TargetDate) { const dl = daysBetween(today(), nx.TargetDate); ec.classList.toggle('hidden', dl < 0); ec.innerHTML = '🎯 <b>' + dl + '</b> days · ' + esc(nx.Section); }
  else ec.classList.add('hidden');
  const nav = [['today','Today'],['plan','Plan'],['focus',''],['progress','Progress'],['journal','Journal']];
  document.getElementById('nav').innerHTML = nav.map(([k, l]) => k === 'focus'
    ? '<div><button class="fab" data-act="openFocus" title="Start a focus block">' + ICONS.focus + '</button></div>'

/* ═════════ focus timer ═════════ */
let F = {total: 50 * 60, left: 50 * 60, run: false, id: null, block: null, t0: 0};
function openFocus(blockId){
  const b = blockId ? D.Plan.find(p => p.ID === blockId) : null;
  F.block = b ? b.ID : null;
  if (!F.run) { let m = 50; if (b) { const x = parseT(b.Time); if (x.e != null) { const n = nowMin(); m = (b.Date === today() && n > x.s && n < x.e) ? x.e - n : x.e - x.s; } } F.total = F.left = Math.max(5, Math.min(240, m)) * 60; }
  document.getElementById('fwhat').textContent = b ? b.Block : 'Free focus block: pick one task and stay on it';
  document.getElementById('fpre').innerHTML = [25, 50, 90].map(m => '<button class="' + (F.total === m * 60 ? 'on' : '') + '" data-act="fSet" data-m="' + m + '">' + m + ' min</button>').join('');
  fDraw(); document.getElementById('focus').classList.add('show');
}
function fDraw(){
  const mm = Math.floor(F.left / 60), ss = F.left % 60;
  document.getElementById('ftime').textContent = mm >= 60 ? Math.floor(mm / 60) + ':' + pad(mm % 60) + ':' + pad(ss) : pad(mm) + ':' + pad(ss);
  document.getElementById('fsub').textContent = F.run ? 'focusing' : F.left < F.total ? 'paused' : 'ready';
  document.getElementById('farc').style.strokeDashoffset = (339.3 * (1 - F.left / F.total)).toFixed(1);
  document.getElementById('fgo').textContent = F.run ? '⏸ Pause' : F.left < F.total ? '▶ Resume' : '▶ Start';
  if (F.run) document.title = '⏱ ' + document.getElementById('ftime').textContent + ' · Sunil OS';
}
let WL = null;
function fToggle(){
  if (F.run) { F.run = false; clearInterval(F.id); document.title = 'Sunil OS'; try { WL && WL.release(); } catch (e) {} }
  else { F.run = true; F.t0 = Date.now() - (F.total - F.left) * 1000; F.id = setInterval(() => { F.left = Math.max(0, F.total - Math.round((Date.now() - F.t0) / 1000)); fDraw(); if (!F.left) { beep(); fFinish(); } }, 500);
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => WL = w).catch(() => {}); } catch (e) {} }
  fDraw();
}
function fFinish(){
  const mins = Math.round((F.total - F.left) / 60); F.run = false; clearInterval(F.id); document.title = 'Sunil OS';
  document.getElementById('focus').classList.remove('show');
  if (mins < 1) { F.left = F.total; return toast('Nothing to log yet'); }
  if (F.block) { put('Plan', {ID: F.block, Done: 'Yes'}); toast('✓ Block done · ' + mins + ' min focused'); }
  else { put('StudyLog', {Date: today(), Section: (nextExam() || {}).Section || 'FAR', Minutes: mins, Notes: 'Focus timer'}); toast('✓ ' + mins + ' min logged'); }
  confetti(innerWidth / 2, innerHeight / 2, 90, true); F.left = F.total; F.block = null;
}
function beep(){ try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(t => { const o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .22); }); } catch (e) {} }

  mock: () => form('Log a mock exam', [{name: 'Type', label: 'Type', type: 'select', options: ['Mocktest', 'Practice Exam', 'Mini Mocktest', 'AICPA Released'], value: 'Mocktest'}, {name: 'Date', label: 'Date', type: 'date', value: today()},
    {name: 'T1', label: 'Testlet 1 · MCQ %', type: 'number'}, {name: 'T2', label: 'Testlet 2 · MCQ %', type: 'number'}, {name: 'T3', label: 'Testlet 3 · SIM %', type: 'number'}, {name: 'T4', label: 'Testlet 4 · SIM %', type: 'number'}, {name: 'T5', label: 'Testlet 5 · SIM %', type: 'number'},
    {name: 'TimeLeftMin', label: 'Minutes left when you finished', type: 'number'}, {name: 'MCQPct', label: 'Or overall MCQ % (if no testlet split)', type: 'number'}, {name: 'SIMPct', label: 'Or overall SIM %', type: 'number'}, {name: 'Notes', label: 'Weak spots it exposed', type: 'textarea'}],
    o => { const av = ks => { const v = ks.map(k => o[k]).filter(x => x !== '').map(num); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; };
      const m = av(['T1', 'T2']) ?? (o.MCQPct === '' ? null : num(o.MCQPct)), s = av(['T3', 'T4', 'T5']) ?? (o.SIMPct === '' ? null : num(o.SIMPct));
      o.MCQPct = m ?? ''; o.SIMPct = s ?? ''; o.Score = m != null && s != null ? Math.round((m + s) / 2 * 10) / 10 : (m ?? s ?? '');
      put('Mocks', {...o, Section: (nextExam() || {}).Section || 'FAR'}); toast('Mock logged · now log each wrong answer in the error log');
      setTimeout(() => errorForm({Source: o.Type + ' ' + fmtD(o.Date)}), 700); }, {sub: 'Enter testlet scores from the score report. The app finds your weakest testlet and pacing problems.'}),
  logError: () => errorForm(),
  traps: () => trapsSheet(),
  fixErr: (d, el) => { put('Errors', {ID: d.id, Status: 'Fixed'}, true); el.closest('.trap').style.opacity = .35; el.textContent = '✓'; el.style.background = 'var(--good)'; toast('Trap cleared 💪'); },
  calSync: (d, el) => { el.textContent = 'Syncing…'; run('syncCalendar').then(r => { setting('CalendarSync', 'on'); toast(r && r.busy ? 'Sync already running' : '📅 Calendar synced · ' + ((r.created || 0) + (r.updated || 0)) + ' blocks'); settingsSheet('cal'); }).catch(e => { el.textContent = 'Turn on phone alerts'; toast('⚠️ ' + (e.message || e)); }); },
  editSection: d => { const c = D.CPA.find(x => x.ID === d.id); form(c.Section + ' section', [{name: 'Status', label: 'Status', type: 'select', options: ['Not Started', 'Studying', 'NTS Paid', 'Exam Scheduled', 'Passed', 'Failed – Retake'], value: c.Status},
    {name: 'TargetDate', label: 'Exam date', type: 'date', value: c.TargetDate}, {name: 'Score', label: 'Score', type: 'number', value: c.Score}, {name: 'Notes', label: 'Notes', type: 'textarea', value: c.Notes}], o => { put('CPA', {ID: c.ID, ...o}); if (o.Status === 'Passed') { confetti(innerWidth / 2, innerHeight / 3, 200, true); toast('🎉 ' + c.Section + ' PASSED!'); } }); },
  addMilestone: () => form('Add a milestone', [{name: 'Title', label: 'What', req: true}, {name: 'Date', label: 'Date', type: 'date', req: true}, {name: 'Icon', label: 'Emoji', value: '📍'}, {name: 'Note', label: 'Note'}], o => put('Milestones', o)),
  editMilestone: d => { const m = D.Milestones.find(x => x.ID === d.id); form('Edit milestone', [{name: 'Title', label: 'What', value: m.Title, req: true}, {name: 'Date', label: 'Date', type: 'date', value: m.Date, req: true}, {name: 'Icon', label: 'Emoji', value: m.Icon}, {name: 'Note', label: 'Note', value: m.Note}], o => put('Milestones', {ID: m.ID, ...o}), {onDelete: () => drop('Milestones', m.ID)}); },
  addGoal: () => goalForm({}), editGoal: d => goalForm(D.Goals.find(g => g.ID === d.id)),
  addCourse: () => courseForm({}), editCourse: d => courseForm(D.Courses.find(c => c.ID === d.id)),
  courseUp: d => { const c = D.Courses.find(x => x.ID === d.id), n = Math.min(num(c.TotalUnits), num(c.DoneUnits) + 1); put('Courses', {ID: c.ID, DoneUnits: n, Status: n >= num(c.TotalUnits) ? 'Completed' : 'In Progress'}); toast(n >= num(c.TotalUnits) ? '🎉 Course finished!' : 'Module done ✅'); },
  addIdea: () => ideaForm({}), editIdea: d => ideaForm(D.Ideas.find(i => i.ID === d.id)),
  addWin: () => form('Log a win or setback', [{name: 'Type', label: 'Type', type: 'select', options: [['Win', '🏆 Win'], ['Breakage', '💔 Setback'], ['Improvement', '📈 Improvement']]},
    {name: 'GoalID', label: 'Related goal', type: 'select', options: [['', '—']].concat(D.Goals.filter(g => g.Status === 'Active').map(g => [g.ID, g.Title]))}, {name: 'Note', label: 'What happened?', type: 'textarea', req: true}, {name: 'Lesson', label: 'Lesson / what you\'ll do differently', type: 'textarea'}],
    o => { if (o.Type === 'Breakage' && !o.Lesson) return toast('Add the lesson. That\'s the point of logging a setback'); put('GoalLog', {...o, Date: today()}); toast(o.Type === 'Win' ? '🏆 Logged' : 'Logged. Owning it is the first fix'); }),
  delThought: d => drop('Thoughts', d.id),
  openSettings: d => settingsSheet(d.s),
  delHabit: d => { put('Habits', {ID: d.id, Active: 'No'}, true); settingsSheet('habits'); render(); },
  rem: d => run(d.on === '1' ? 'installTriggers' : 'removeTriggers').then(r => toast(r || 'Done')).catch(e => toast('⚠️ ' + (e.message || e))),
  testMail: () => run('morningBrief').then(() => toast('📧 Test email sent')).catch(e => toast('⚠️ ' + (e.message || e))),
  openFocus: d => openFocus(d.id), fToggle: () => fToggle(), fFinish: () => fFinish(),
  fClose: () => { if (F.run && !confirm('Stop the timer without logging?')) return; F.run = false; clearInterval(F.id); F.left = F.total; document.title = 'Sunil OS'; document.getElementById('focus').classList.remove('show'); },
  fSet: d => { if (F.run) return toast('Pause first'); F.total = F.left = d.m * 60; openFocus(F.block); }
};
const PRAISE = ['Locked in 🔒', 'Future CFO move 📈', 'One step closer to 21 Dec 🎯', 'Streak alive ⚡', 'That\'s how toppers do it 🏅', 'USA is calling 🇺🇸', 'Beast mode 💪'];
function taskForm(x){ form(x.ID ? 'Edit task' : 'New task', [{name: 'Title', label: 'Task', value: x.Title, req: true}, {name: 'DueDate', label: 'Due date', type: 'date', value: x.ID ? x.DueDate : today()},
  {name: 'Priority', label: 'Priority', type: 'select', options: ['High', 'Medium', 'Low'], value: x.Priority || 'Medium'}, {name: 'Category', label: 'Category', type: 'select', options: ['CPA', 'Work', 'Family', 'Health', 'Finance', 'Personal', 'Course', 'Discipline', 'Idea'], value: x.Category || 'CPA'}],
  o => put('Tasks', {ID: x.ID, Status: x.Status || 'Pending', ...o}), x.ID ? {onDelete: () => drop('Tasks', x.ID)} : {}); }
function goalForm(g){ form(g.ID ? 'Edit goal' : 'New goal', [{name: 'Title', label: 'Goal', value: g.Title, req: true}, {name: 'Why', label: 'Why it matters (you will read this on bad days)', type: 'textarea', value: g.Why}, {name: 'TargetDate', label: 'Target date', type: 'date', value: g.TargetDate},
  {name: 'Status', label: 'Status', type: 'select', options: ['Active', 'Achieved', 'Paused', 'Dropped'], value: g.Status || 'Active'}], o => { put('Goals', {ID: g.ID, Category: g.Category || 'CPA', Progress: g.Progress || 0, ...o}); if (o.Status === 'Achieved') confetti(innerWidth / 2, innerHeight / 3, 160, true); }, g.ID ? {onDelete: () => drop('Goals', g.ID)} : {}); }
function courseForm(c){ form(c.ID ? 'Edit course' : 'New course', [{name: 'Name', label: 'Course', value: c.Name, req: true}, {name: 'TotalUnits', label: 'Total modules', type: 'number', value: c.TotalUnits || 10}, {name: 'DoneUnits', label: 'Completed', type: 'number', value: c.DoneUnits || 0}, {name: 'TargetDate', label: 'Finish by', type: 'date', value: c.TargetDate}],
  o => put('Courses', {ID: c.ID, Status: c.Status || 'In Progress', ...o}), c.ID ? {onDelete: () => drop('Courses', c.ID)} : {}); }
function ideaForm(i){ form(i.ID ? 'Edit idea' : 'Capture an idea', [{name: 'Title', label: 'Idea', value: i.Title, req: true}, {name: 'Detail', label: 'Details', type: 'textarea', value: i.Detail}, {name: 'NextStep', label: 'Very next physical step', value: i.NextStep},
  {name: 'Status', label: 'Stage', type: 'select', options: ['Captured', 'Evaluating', 'In Progress', 'Implemented', 'Dropped'], value: i.Status || 'Captured'}],
  o => { put('Ideas', {ID: i.ID, Date: i.Date || today(), Impact: i.Impact || 'Medium', ...o}); if (o.Status === 'In Progress' && o.NextStep && (!i.ID || i.Status !== 'In Progress')) { put('Tasks', {Title: o.NextStep, Category: 'Idea', Priority: 'Medium', DueDate: today(), Status: 'Pending'}); toast('Next step added to today\'s tasks'); } },
  i.ID ? {onDelete: () => drop('Ideas', i.ID)} : {}); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || !el.dataset.chg) return;
  if (el.dataset.chg === 'pickDay') { DATE = el.value || today(); render(); }
  if (el.dataset.chg === 'goalProg') { put('Goals', {ID: el.dataset.id, Progress: el.value}); if (el.value === '100') confetti(innerWidth / 2, innerHeight / 3, 120, true); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset || !f.dataset.sub) return; e.preventDefault();
  const v = f.t ? f.t.value.trim() : ''; if (!v) return;
  if (f.dataset.sub === 'quickTask') { put('Tasks', {Title: v, DueDate: f.dataset.d, Priority: 'Medium', Category: 'CPA', Status: 'Pending'}); toast('Task added'); }
  if (f.dataset.sub === 'thought') { put('Thoughts', {Date: today(), Mood: '', Text: v}); toast('Saved'); }
  if (f.dataset.sub === 'addHabit') { put('Habits', {Name: v, Icon: (f.i && f.i.value.trim()) || '✅', Order: D.Habits.length + 1, Active: 'Yes'}, true); settingsSheet('habits'); render(); }
});

start();
</script>
